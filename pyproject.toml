[project]
name = "recommendation-labs"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "hyperopt==0.2.5",
    "numpy<2",
    "pandas<3",
    "ray[tune]>=2.58.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "ray[tune]==2.40.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "recbole @ git+https://github.com/masoudmansoury/RecBole_DSAIT4335.git@7aa0ec90ebf51346a0b81dee9198a8279cadccf2",
    "setuptools<81",
    "ipykernel>=7.4.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["source"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
]

[tool.ruff]
exclude = [".venv"]
line-length = 150

[tool.ruff.lint]
ignore = ["I001"]
