[project]
name = "recommendation-labs"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy<2",
    "ray[tune]>=2.58.0",
    "recbole @ git+https://github.com/masoudmansoury/RecBole_DSAIT4335.git@439c5a899296cbaad9842751dd4355393f22d679",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["source"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
]
