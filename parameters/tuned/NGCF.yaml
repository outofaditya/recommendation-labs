model: NGCF
dataset: ml-100k
data_path: data/
embedding_size: 64
hidden_size_list:
- 64
- 64
- 64
node_dropout: 0.0
message_dropout: 0.0
reg_weight: 1e-5
epochs: 300
train_batch_size: 2048
learner: adam
learning_rate: 0.0005
eval_step: 5
stopping_step: 5
eval_args:
  split:
    RS:
    - 0.8
    - 0.1
    - 0.1
  group_by: user
  order: RO
  mode: full
metrics:
- Recall
- MRR
- NDCG
- Hit
- Precision
topk:
- 10
valid_metric: NDCG@10
show_progress: false
checkpoint_dir: results/checkpoints
