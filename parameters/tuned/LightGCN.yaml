model: LightGCN
dataset: ml-100k
data_path: data/
seed: 2020
reproducibility: true
embedding_size: 64
n_layers: 5
reg_weight: 0.0001
require_pow: false
epochs: 300
train_batch_size: 4096
learner: adam
learning_rate: 0.005
eval_step: 5
stopping_step: 5
eval_args:
  split:
    RS:
    - 0.8
    - 0.1
    - 0.1
  group_by: user
  order: RO
  mode: full
metrics:
- Recall
- MRR
- NDCG
- Hit
- Precision
topk:
- 10
valid_metric: NDCG@10
show_progress: false
checkpoint_dir: results/checkpoints
